language: go

# Seal: Travis no longer honours `go_import_path` for this fork's checkout dir
# (the job lands in /home/travis/build/<org>/gobgp-<sha>, outside GOPATH/src),
# so `dep` aborted with "is not within a known GOPATH/src". Build the GOPATH
# layout explicitly and work from the symlinked path.
_gopath_setup: &_gopath_setup
  - export GOPATH="${GOPATH:-$HOME/gopath}"
  - export GO111MODULE=off
  - mkdir -p "$GOPATH/src/github.com/osrg"
  - rm -rf "$GOPATH/src/github.com/osrg/gobgp"
  - ln -sfn "$TRAVIS_BUILD_DIR" "$GOPATH/src/github.com/osrg/gobgp"
  - go get -u github.com/golang/dep/cmd/dep
  - cd "$GOPATH/src/github.com/osrg/gobgp"

# Seal: nested YAML merge keys (`<<: *_dep_ensure` inside another anchor that is
# itself merged) were silently dropped by Travis, so the cross-compile legs ran
# on the image default Go 1.25 instead of 1.11. Every anchor now spells out
# `go:`, `before_install:` and `install:` instead of merging another anchor.
_dep_ensure: &_dep_ensure
  go: "1.11"
  before_install: *_gopath_setup
  install: $GOPATH/bin/dep ensure -vendor-only -v

_unittest: &_unittest
  go: "1.11"
  before_install: *_gopath_setup
  install: $GOPATH/bin/dep ensure -vendor-only -v
  script:
    - go test $([ $(go env GOARCH) == 'amd64' ] && echo '-race') $(go list ./... | grep -v '/vendor/') -timeout 120s
    - if [ "$(go env GOARCH)" = "amd64" ]; then go test -race github.com/osrg/gobgp/pkg/packet/bgp -run ^Test_RaceCondition$; else echo 'skip'; fi

_build: &_build
  go: "1.11"
  before_install: *_gopath_setup
  install: $GOPATH/bin/dep ensure -vendor-only -v
  script:
    - go build -o ./cmd/gobgp/gobgp   ./cmd/gobgp/
    - go build -o ./cmd/gobgpd/gobgpd ./cmd/gobgpd/

_node_js: &_node_js
  language: node_js
  node_js: "16"

_python: &_python
  language: python
  python: "2.7"

matrix:
  include:
#
# Unit Tests
#
    - <<: *_unittest
      env:
        - DESCRIPTION="Unit Tests"
    - <<: *_unittest
      env:
        - DESCRIPTION="Tests + cover"
      script:
        - go test $(go list ./... | grep -v '/vendor/') -coverprofile=coverage.txt -covermode=atomic -timeout 120s
    - <<: *_unittest
      env:
        - DESCRIPTION="Unit Tests on i386"
      before_script:
        - export GOARCH="386"
        - go env

#
# Cross-compile
#
# Note: We use "before_script" to enable "go env" settings. The following keeps
# "env" sections as just markers of Travis-CI Web UI.
# See https://github.com/travis-ci/travis-ci/issues/6126
#
# Seal: the marker must NOT be named GOOS. Travis exports the matrix `env:` before
# it provisions Go, and gimme cannot fetch a go1.11 toolchain for a non-host GOOS,
# so it silently kept the image default (go1.25.3) and every cross-compile leg died
# on "modules disabled by GO111MODULE=off". Only `before_script` sets the real GOOS,
# which is after the toolchain is installed and after `dep ensure` has vendored.
    - <<: *_build
      env:
        - DESCRIPTION="Cross-compile openbsd"
      before_script:
        - export GOOS="openbsd"
        - go env
    - <<: *_build
      env:
        - DESCRIPTION="Cross-compile freebsd"
      before_script:
        - export GOOS="freebsd"
        - go env
    - <<: *_build
      env:
        - DESCRIPTION="Cross-compile darwin"
      before_script:
        - export GOOS="darwin"
        - go env
#
# Misc
#
    - <<: *_dep_ensure
      env:
        - DESCRIPTION="go fmt + vet"
      script:
        - test -z "$(go fmt $(go list ./... | grep -v '/vendor/'))"
        - go vet $(go list ./... | grep -v '/vendor/')
    - <<: *_dep_ensure
      env:
        - DESCRIPTION="build_embeded_go.py"
      script: python3 test/scenario_test/ci-scripts/build_embeded_go.py docs/sources/lib.md
#
# Tools
#
    - <<: *_node_js
      env:
        - DESCRIPTION="markdownlint"
      before_script:
        - npm install -g markdownlint-cli@0.13.0
      script:
        - markdownlint $(find . -type f -name '*.md' | grep -v '/vendor/')
    - <<: *_python
      env:
        - DESCRIPTION="Tools"
      install: pip install scspell3k
      script:
        - bash tools/spell-check/scspell.sh
        - bash tools/grep_avoided_functions.sh

cache:
  pip: true

go_import_path: github.com/osrg/gobgp
